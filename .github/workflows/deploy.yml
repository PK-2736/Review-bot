name: Deploy to Oracle Ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "❌ ERROR: SSH_HOST is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "❌ ERROR: SSH_USER is not set"
            exit 1
          fi
          echo "✅ All required secrets are present"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "📝 Adding host: ${{ secrets.SSH_HOST }}"
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>&1
          echo "✅ Host added successfully"

      - name: Deploy to server
        run: |
          echo "🚀 Starting deployment..."
          echo "📍 Target: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          
          ssh -vvv -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -x
            
            echo "========================================="
            echo "📦 Review-bot Deployment Started"
            echo "========================================="
            
            # System information
            echo ""
            echo "📊 System Information:"
            uname -a
            pwd
            whoami
            echo ""
            
            # Node.js check
            echo "🔍 Checking Node.js..."
            if ! command -v node &> /dev/null; then
              echo "❌ Node.js not found. Installing..."
              sudo apt-get update
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
              echo "✅ Node.js installed: $(node --version)"
            else
              echo "✅ Node.js found: $(node --version)"
            fi
            
            # npm check
            echo ""
            echo "🔍 Checking npm..."
            if ! command -v npm &> /dev/null; then
              echo "❌ npm not found!"
              exit 1
            else
              echo "✅ npm found: $(npm --version)"
            fi
            
            # Git check
            echo ""
            echo "🔍 Checking Git..."
            if ! command -v git &> /dev/null; then
              echo "❌ Git not found. Installing..."
              sudo apt-get update
              sudo apt-get install -y git
              echo "✅ Git installed"
            else
              echo "✅ Git found: $(git --version)"
            fi
            
            # Repository setup
            echo ""
            echo "📁 Setting up repository..."
            if [ -d "$HOME/Review-bot" ]; then
              echo "📂 Repository exists. Pulling latest changes..."
              cd $HOME/Review-bot
              git clean -fd
              git pull origin main || { echo "❌ Git pull failed!"; exit 1; }
              echo "✅ Repository updated"
            else
              echo "📥 Cloning repository..."
              cd $HOME
              git clone https://github.com/${{ github.repository }}.git Review-bot || { echo "❌ Git clone failed!"; exit 1; }
              cd Review-bot
              echo "✅ Repository cloned"
            fi
            
            # Dependencies
            echo ""
            echo "📚 Installing dependencies..."
            npm install --production || { echo "❌ npm install failed!"; exit 1; }
            echo "✅ Dependencies installed"
            
            # Environment setup
            echo ""
            echo "🔐 Creating .env file..."
            echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" > .env
            echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> .env
            echo "TODOIST_API_TOKEN=${{ secrets.TODOIST_API_TOKEN }}" >> .env
            echo "DEFAULT_PROJECT_NAME=${{ secrets.DEFAULT_PROJECT_NAME || '復習タスク' }}" >> .env
            echo "TODO_NOTIFICATION_CHANNEL_ID=${{ secrets.TODO_NOTIFICATION_CHANNEL_ID || '1468959638052540439' }}" >> .env
            echo "CLASSROOM_ENABLED=${{ secrets.CLASSROOM_ENABLED || 'false' }}" >> .env
            echo "CLASSROOM_SYNC_TIME=${{ secrets.CLASSROOM_SYNC_TIME || '0 7 * * *' }}" >> .env
            echo "CLASSROOM_DUE_WITHIN_DAYS=${{ secrets.CLASSROOM_DUE_WITHIN_DAYS || '7' }}" >> .env
            echo "REMARKABLE_ENABLED=${{ secrets.REMARKABLE_ENABLED || 'false' }}" >> .env
            echo "REMARKABLE_SYNC_TIME=${{ secrets.REMARKABLE_SYNC_TIME || '0 22 * * *' }}" >> .env
            echo "REMARKABLE_TIMEZONE=${{ secrets.REMARKABLE_TIMEZONE || 'Asia/Tokyo' }}" >> .env
            echo "REMARKABLE_PROJECT_PREFIX=${{ secrets.REMARKABLE_PROJECT_PREFIX || '' }}" >> .env
            echo "REMARKABLE_MCP_URL=${{ secrets.REMARKABLE_MCP_URL || 'https://mcp.recrubo.net' }}" >> .env
            echo "REMARKABLE_MCP_TOKEN=${{ secrets.REMARKABLE_MCP_TOKEN || '' }}" >> .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || '' }}" >> .env
            echo "GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}" >> .env
            echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI || 'https://developers.google.com/oauthplayground' }}" >> .env
            echo "✅ .env file created"
            
            # PM2 setup
            echo ""
            echo "🔍 Checking PM2..."
            if ! command -v pm2 &> /dev/null; then
              echo "❌ PM2 not found. Installing..."
              sudo npm install -g pm2
              echo "✅ PM2 installed: $(pm2 --version)"
            else
              echo "✅ PM2 found: $(pm2 --version)"
            fi
            
            # Create logs directory
            echo ""
            echo "📁 Creating logs directory..."
            mkdir -p $HOME/Review-bot/logs
            echo "✅ Logs directory ready"
            
            # Start/Restart application
            echo ""
            echo "🚀 Starting application with PM2..."
            pm2 delete review-bot 2>/dev/null || true
            pm2 start ecosystem.config.js --env production || { echo "❌ PM2 start failed!"; exit 1; }
            echo "✅ Application started"
            
            # Save PM2 config
            echo ""
            echo "💾 Saving PM2 configuration..."
            pm2 save || true
            echo "✅ PM2 configuration saved"
            
            # Show status
            echo ""
            echo "📊 Application Status:"
            pm2 list
            pm2 logs review-bot --lines 10 --nostream
            
            echo ""
            echo "========================================="
            echo "✅ Deployment Completed Successfully!"
            echo "========================================="
          ENDSSH
        timeout-minutes: 30

      - name: Deployment notification
        if: always()
        run: |
          echo "========================================="
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment Successful!"
            echo "🚀 Bot is now running on the server"
          else
            echo "❌ Deployment Failed!"
            echo "📋 Check the logs above for error details"
          fi
          echo "========================================="
